<div
  class="fade show d-flex flex-column align-items-center justify-content-center"
  *ngIf="loading"
  style="height: 100vh; width: 100%; position: absolute; top: 0; left: 0; z-index: 1050; background-color: #121214; color: #ffffff; font-family: 'Segoe UI', system-ui, sans-serif;"
>
  <div style="position: relative; width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; margin-bottom: 24px;">
    <div style="position: absolute; width: 100%; height: 100%; border: 4px solid rgba(0, 242, 254, 0.1); border-radius: 50%;"></div>
    <div style="position: absolute; width: 100%; height: 100%; border: 4px solid transparent; border-top-color: #00F2FE; border-radius: 50%; animation: spin 1s cubic-bezier(0.55, 0.085, 0.68, 0.53) infinite;"></div>
    <div style="width: 24px; height: 24px; background-color: #00F2FE; border-radius: 50%; box-shadow: 0 0 15px #00F2FE; animation: pulse 1.5s ease-in-out infinite;"></div>
  </div>
  <h4 style="font-weight: 700; letter-spacing: 2px; margin: 0; background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">PixelMind</h4>
  <p style="color: #6b7280; font-size: 13px; font-weight: 500; letter-spacing: 4px; margin-top: 8px; text-transform: uppercase;">Authenticating...</p>
  <style>
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(0.85); opacity: 0.5; }
      50% { transform: scale(1.15); opacity: 1; }
    }
  </style>
</div>

<div
  class="bg-light dark:bg-transparent min-vh-100 d-flex flex-row align-items-center"
>
  <c-container breakpoint="md">
    <c-row class="justify-content-center">
      <c-col lg="10" xl="8">
        <c-card-group>
          <c-card class="p-4">
            <c-card-body>
              <form [formGroup]="loginForm" cForm>
                <h1>Login</h1>
                <p class="text-body-secondary">Sign In to your account</p>
                <c-input-group class="mb-3">
                  <span cInputGroupText>
                    <svg cIcon name="cilUser"></svg>
                  </span>
                  <input
                    autoComplete="username"
                    formControlName="username"
                    cFormControl
                    placeholder="Username"
                    required="true"
                  />
                </c-input-group>
                <div
                  *ngIf="
                    loginForm.get('username').errors?.required &&
                    loginForm.get('username').touched
                  "
                >
                  <p class="form-validation">Username is required.</p>
                </div>
                <c-input-group class="mb-4">
                  <span cInputGroupText>
                    <svg cIcon name="cilLockLocked"></svg>
                  </span>
                  <input
                    autoComplete="current-password"
                    formControlName="password"
                    cFormControl
                    placeholder="Password"
                    type="password"
                    required="true"
                  />
                </c-input-group>
                <div
                  *ngIf="
                    loginForm.get('password').errors?.required &&
                    loginForm.get('password').touched
                  "
                >
                  <p class="form-validation">Password is required.</p>
                </div>
                <c-row>
                  <c-col xs="6">
                    <button
                      cButton
                      class="px-4"
                      color="primary"
                      (click)="login()"
                    >
                      Login
                    </button>
                  </c-col>
                  <c-col class="text-right" xs="6">
                    <button cButton class="px-0" color="link">
                      Forgot password?
                    </button>
                  </c-col>
                </c-row>
              </form>
            </c-card-body>
          </c-card>
          <c-card
            [ngStyle]="{ 'minWidth.%': 44 }"
            class="text-white bg-primary py-5"
          >
            <c-card-body class="text-center">
              <div>
                <h2>Sign up</h2>
                <p>
                  If you are not yet registered as a candidate, please take a
                  moment to create your profile and join us today.
                </p>
                <button
                  cButton
                  class="mt-3"
                  color="primary"
                  (click)="redirectToRegister()"
                >
                  Register Now!
                </button>
              </div>
            </c-card-body>
          </c-card>
        </c-card-group>
      </c-col>
    </c-row>
  </c-container>
</div>
