<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2744" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a192f" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Circles -->
  <circle cx="300" cy="250" r="190" fill="url(#bgGrad)" filter="url(#softGlow)"/>
  <circle cx="450" cy="130" r="90" fill="#0284c7" fill-opacity="0.08" filter="url(#softGlow)"/>
  <circle cx="140" cy="380" r="110" fill="#3b82f6" fill-opacity="0.08" filter="url(#softGlow)"/>

  <!-- Orbital Dashed Rings -->
  <circle cx="300" cy="250" r="170" stroke="#38bdf8" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="6 8"/>
  <circle cx="300" cy="250" r="225" stroke="#3b82f6" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="4 6"/>

  <!-- Main Central Job Portal Search Window -->
  <g filter="url(#cardShadow)">
    <rect x="110" y="90" width="380" height="260" rx="20" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.5"/>
    
    <!-- Window Header -->
    <rect x="110" y="90" width="380" height="42" rx="20" fill="#1e293b" fill-opacity="0.5"/>
    <circle cx="134" cy="111" r="5" fill="#ef4444" fill-opacity="0.7"/>
    <circle cx="150" cy="111" r="5" fill="#eab308" fill-opacity="0.7"/>
    <circle cx="166" cy="111" r="5" fill="#22c55e" fill-opacity="0.7"/>

    <!-- Search Input Inside Window -->
    <rect x="195" y="100" width="275" height="22" rx="11" fill="#0f172a" fill-opacity="0.8" stroke="#38bdf8" stroke-opacity="0.2"/>
    <circle cx="210" cy="111" r="4.5" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="213.5" y1="114.5" x2="217" y2="118" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>
    <text x="226" y="115" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" font-weight="500">Search software engineer roles...</text>

    <!-- Job Vacancy Card 1 -->
    <g transform="translate(130, 146)">
      <rect x="0" y="0" width="340" height="58" rx="12" fill="#0f172a" fill-opacity="0.7" stroke="#3b82f6" stroke-opacity="0.2"/>
      <!-- Company Icon Badge -->
      <rect x="12" y="11" width="36" height="36" rx="8" fill="url(#primaryGrad)"/>
      <!-- Suitcase Icon -->
      <path d="M25 24 H35 V37 H25 Z M27 24 V21 C27 20 28 19 29 19 H31 C32 19 33 20 33 21 V24" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
      <text x="58" y="27" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Lead Frontend Engineer</text>
      <text x="58" y="41" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">PixelMind Group • Remote / Hybrid</text>
      <!-- Match Pill -->
      <rect x="268" y="18" width="60" height="22" rx="11" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-opacity="0.4"/>
      <text x="298" y="32" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">98% Match</text>
    </g>

    <!-- Job Vacancy Card 2 -->
    <g transform="translate(130, 214)">
      <rect x="0" y="0" width="340" height="58" rx="12" fill="#0f172a" fill-opacity="0.7" stroke="#3b82f6" stroke-opacity="0.2"/>
      <!-- Company Icon Badge -->
      <rect x="12" y="11" width="36" height="36" rx="8" fill="url(#cyanGrad)"/>
      <!-- Code Icon -->
      <path d="M26 26 L22 30 L26 34 M34 26 L38 30 L34 34 M31 23 L29 37" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
      <text x="58" y="27" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Senior Cloud Architect</text>
      <text x="58" y="41" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Enterprise Solutions • Full-time</text>
      <!-- Applied Pill -->
      <rect x="272" y="18" width="56" height="22" rx="11" fill="rgba(34, 197, 94, 0.15)" stroke="#22c55e" stroke-opacity="0.4"/>
      <text x="300" y="32" fill="#4ade80" font-family="'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">Applied ✓</text>
    </g>

    <!-- Job Vacancy Card 3 (Peek) -->
    <g transform="translate(130, 282)">
      <rect x="0" y="0" width="340" height="52" rx="12" fill="#0f172a" fill-opacity="0.5" stroke="#3b82f6" stroke-opacity="0.1"/>
      <rect x="12" y="10" width="32" height="32" rx="8" fill="#334155"/>
      <text x="58" y="28" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="12" font-weight="500">UI/UX Product Designer</text>
    </g>
  </g>

  <!-- Floating Floating Widget 1: Profile Verified (Top Left) -->
  <g filter="url(#cardShadow)" transform="translate(50, 160)">
    <rect x="0" y="0" width="168" height="60" rx="14" fill="url(#cardGrad2)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5"/>
    <circle cx="32" cy="30" r="18" fill="url(#avatarGrad)"/>
    <!-- Checkmark Badge on avatar -->
    <circle cx="42" cy="40" r="7" fill="#22c55e"/>
    <path d="M39 40 L41 42 L45 38" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Avatar silhouette -->
    <circle cx="32" cy="26" r="6" fill="#ffffff"/>
    <path d="M22 38 C22 33 26 31 32 31 C38 31 42 33 42 38 Z" fill="#ffffff"/>
    
    <text x="60" y="26" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Alex Morgan</text>
    <text x="60" y="40" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="9.5" font-weight="600">Candidate Verified</text>
  </g>

  <!-- Floating Widget 2: Interview Scheduled (Bottom Right) -->
  <g filter="url(#cardShadow)" transform="translate(370, 310)">
    <rect x="0" y="0" width="180" height="64" rx="14" fill="url(#cardGrad2)" stroke="#3b82f6" stroke-opacity="0.35" stroke-width="1.5"/>
    <!-- Calendar icon badge -->
    <rect x="14" y="14" width="36" height="36" rx="10" fill="url(#primaryGrad)"/>
    <!-- Calendar Icon -->
    <rect x="22" y="23" width="20" height="18" rx="3" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="22" y1="28" x2="42" y2="28" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="27" y1="20" x2="27" y2="23" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="37" y1="20" x2="37" y2="23" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    
    <text x="60" y="29" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Interview Call</text>
    <text x="60" y="44" fill="#a5f3fc" font-family="'Inter', sans-serif" font-size="9.5" font-weight="500">Tomorrow • 10:30 AM</text>
  </g>

  <!-- Floating Sparkles & Accent Geometry -->
  <g fill="#38bdf8" opacity="0.8">
    <!-- Star 1 -->
    <path d="M100 80 Q108 80 108 72 Q108 80 116 80 Q108 80 108 88 Q108 80 100 80 Z"/>
    <!-- Star 2 -->
    <path d="M510 220 Q516 220 516 214 Q516 220 522 220 Q516 220 516 226 Q516 220 510 220 Z"/>
    <!-- Star 3 -->
    <path d="M260 410 Q266 410 266 404 Q266 410 272 410 Q266 410 266 416 Q266 410 260 410 Z"/>
  </g>
  
  <circle cx="505" cy="115" r="4" fill="#60a5fa" opacity="0.6"/>
  <circle cx="85" cy="330" r="3.5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="330" cy="65" r="3" fill="#93c5fd" opacity="0.5"/>
</svg>
